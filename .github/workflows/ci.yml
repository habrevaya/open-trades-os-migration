name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # No version here on purpose. It is declared once, in package.json's
        # packageManager field, and declaring it in both places makes this
        # action fail before a single step has run.

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm build

      - name: The CLI runs
        # A toolkit whose tests pass and whose binary does not start is worse
        # than useless, because the failure lands on the operator at 2am.
        run: pnpm dev sources

      - name: A snapshot goes all the way through
        # Extract a real export from files, then load it into the in-memory
        # tenant. The tests prove the parts; this proves the commands are
        # wired to them.
        run: |
          pnpm dev extract --source csv --from fixtures/csv/mapped --out "$RUNNER_TEMP/snapshot"
          pnpm dev map --in "$RUNNER_TEMP/snapshot"
          pnpm dev dryrun --in "$RUNNER_TEMP/snapshot"

      - name: ServiceTitan report exports go all the way through
        # The default ServiceTitan route: the owner's own XLSX report
        # exports, read with the ServiceTitan preset, then profiled for
        # joins left open and dry run into the in-memory tenant.
        run: |
          pnpm dev extract --source servicetitan --from fixtures/servicetitan-reports --timezone America/Chicago --out "$RUNNER_TEMP/servicetitan-reports"
          pnpm dev profile --in "$RUNNER_TEMP/servicetitan-reports"
          pnpm dev map --in "$RUNNER_TEMP/servicetitan-reports"
          pnpm dev dryrun --in "$RUNNER_TEMP/servicetitan-reports"

      - name: A snapshot someone else produced goes all the way through
        # The advanced ServiceTitan route: canonical files in, every record
        # checked against the schema, then the same loader as every other
        # source. The folder's customer.ndjson selects it without --format.
        run: |
          pnpm dev extract --source servicetitan --from fixtures/servicetitan --out "$RUNNER_TEMP/servicetitan"
          pnpm dev dryrun --in "$RUNNER_TEMP/servicetitan"
          pnpm dev extract --source servicetitan --format canonical --from fixtures/servicetitan --out "$RUNNER_TEMP/servicetitan-explicit"
