# Weekly dependency updates, grouped so a week is one pull request per
# ecosystem rather than thirty. They target develop, like every other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
